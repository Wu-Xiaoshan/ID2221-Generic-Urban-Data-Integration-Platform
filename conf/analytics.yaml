# Analytical layer configuration.

sources:
  integrated:  {layer: gold,   table: integrated_taxi_trips}
  trips:       {layer: silver, table: taxi_trips}
  weather:     {layer: silver, table: weather_hourly}
  air_quality: {layer: silver, table: air_quality_hourly}
  zones:       {layer: silver, table: taxi_zones}

reporting_timezone: America/New_York

# Meteostat condition codes, grouped. 
weather_families:
  Clear:      [1, 2]
  Cloudy:     [3, 4]
  Fog:        [5, 6]
  Rain:       [7, 8, 9, 17, 18]
  Snow/Ice:   [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 24]
  Storm:      [23, 25, 26, 27]

# Precipitation in the pickup hour.
precip_buckets:
  - {label: Dry,      max: 0.0}
  - {label: Light,    max: 0.5}
  - {label: Moderate, max: 2.5}
  - {label: Heavy,    max: null}

# Quartiles of PM2.5 over the 2,183 hours of the trip window.
aq_quartiles:
  - {label: "Q1 cleanest", max: 3.68}
  - {label: "Q2",          max: 5.56}
  - {label: "Q3",          max: 8.86}
  - {label: "Q4 dirtiest", max: null}

# EPA 24-hour AQI breakpoints.
aq_epa_categories:
  - {label: Good,                             max: 12.0}
  - {label: Moderate,                         max: 35.4}
  - {label: Unhealthy for Sensitive Groups,   max: 55.4}
  - {label: Unhealthy,                        max: 150.4}
  - {label: Very Unhealthy or worse,          max: null}

thresholds:
  max_plausible_distance_mi: 100
  min_hours_per_family: 24
  min_hours_per_cell: 24
  min_families_per_zone: 4
  min_trips_per_zone: 10000
  peak_hours_per_day: 3

# Zones 264 ('Unknown') and 265 ('Outside of NYC') are sentinels, not places.
sentinel_zone_ids: [264, 265]
